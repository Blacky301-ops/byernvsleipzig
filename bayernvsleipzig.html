<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bayern vs. Leipzig – Live Overlay</title>
<style>
  :root { --red:#e00018; --bg:rgba(8,8,12,.70); }
  * { box-sizing:border-box }
  html,body { margin:0; width:100%; height:100%; background:transparent; color:#fff; font-family:Arial,Helvetica,sans-serif; overflow:hidden; }
  body { display:flex; align-items:flex-start; justify-content:center; padding:16px; }
  .panel { width:min(760px,100%); border:2px solid rgba(224,0,24,.9); border-radius:16px; background:var(--bg); box-shadow:0 8px 28px #0007; overflow:hidden; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:8px 16px; background:rgba(224,0,24,.92); font-weight:800; letter-spacing:.7px; font-size:14px; }
  .live { display:flex; align-items:center; gap:7px; }
  .dot { width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 9px #fff; }
  .scoreline { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:18px 22px 14px; }
  .team { font-size:clamp(16px,3vw,26px); font-weight:900; text-transform:uppercase; line-height:1.05; }
  .team.away { text-align:right; }
  .score { font-size:clamp(30px,5vw,48px); font-weight:900; letter-spacing:2px; white-space:nowrap; }
  .status { padding:0 22px 14px; display:flex; justify-content:space-between; align-items:center; color:#ddd; font-size:13px; }
  #goal { display:none; padding:12px 18px; background:linear-gradient(90deg,rgba(224,0,24,.96),rgba(80,0,8,.92)); font-weight:900; font-size:clamp(16px,2.7vw,23px); text-align:center; }
  #goal.show { display:block; animation:pop .35s ease-out; }
  #sub { color:#bbb; font-size:11px; }
  #soundBtn { position:fixed; right:8px; bottom:8px; border:1px solid #ffffff55; background:#111c; color:#fff; padding:7px 10px; border-radius:8px; font-size:11px; cursor:pointer; }
  #soundBtn.enabled { border-color:#42d66b; }
  @keyframes pop { from { transform:scale(.96);opacity:.5 } to { transform:scale(1);opacity:1 } }
</style>
</head>
<body>
  <main class="panel">
    <div class="top"><span>BUNDESLIGA · SPIELTAG 6</span><span class="live"><i class="dot"></i><span id="liveLabel">LIVE-TICKER</span></span></div>
    <div class="scoreline">
      <div class="team">🔴 Bayern</div>
      <div class="score"><span id="homeScore">–</span> : <span id="awayScore">–</span></div>
      <div class="team away">Leipzig ⚪</div>
    </div>
    <div id="goal"></div>
    <div class="status"><span id="gameStatus">Warte auf Spieldaten …</span><span id="updated">Auto-Update</span></div>
  </main>
  <button id="soundBtn" title="Einmal klicken, um den Tor-Sound freizuschalten">🔊 Sound aktivieren</button>
<script>
(() => {
  const API = "https://www.openligadb.de/api/getmatchdata/bl1/2026/6";
  const $ = id => document.getElementById(id);
  let previousScore = null, soundEnabled = false, lastGoalText = "", hideTimer = null;
  let audioCtx;
  function beep() {
    if (!soundEnabled) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      // Short, playful two-note "ta-daa" alert, generated locally (no external sound file).
      [660,880].forEach((freq,i) => {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "triangle"; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + i*.14);
        gain.gain.exponentialRampToValueAtTime(0.18, now + i*.14 + .025);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*.14 + .22);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i*.14); osc.stop(now + i*.14 + .24);
      });
    } catch(e) {}
  }
  $("soundBtn").addEventListener("click", async () => {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); } catch(e) {}
      $("soundBtn").textContent = "🔊 Sound ist an";
      $("soundBtn").classList.add("enabled");
      beep();
    } else {
      $("soundBtn").textContent = "🔇 Sound aus";
      $("soundBtn").classList.remove("enabled");
    }
  });
  function teamName(m) {
    return ((m.team1 && m.team1.teamName) || "").toLowerCase();
  }
  function team2Name(m) {
    return ((m.team2 && m.team2.teamName) || "").toLowerCase();
  }
  function getScore(m, side) {
    const results = m.matchResults || [];
    const final = results.find(r => r.resultTypeID === 2) || results.find(r => r.resultTypeID === 1) || results[results.length - 1];
    if (!final) return null;
    return side === 1 ? final.pointsTeam1 : final.pointsTeam2;
  }
  function scoreText(m) {
    const a = getScore(m,1), b = getScore(m,2);
    return a == null || b == null ? null : `${a}:${b}`;
  }
  function statusText(m) {
    if (m.matchIsFinished) return "SPIEL BEENDET";
    const start = m.matchDateTime ? new Date(m.matchDateTime) : null;
    if (!start) return "Spielstand wird geladen";
    const now = new Date();
    if (now < start) return "ANPFIFF 18:30 · VOR DEM SPIEL";
    return "LIVE · Spielminute laut Datenquelle";
  }
  function flashGoal(text) {
    if (!text || text === lastGoalText) return;
    lastGoalText = text;
    $("goal").textContent = text;
    $("goal").classList.add("show");
    beep();
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => $("goal").classList.remove("show"), 12000);
  }
  async function update() {
    try {
      const response = await fetch(API + "?_=" + Date.now(), {cache:"no-store"});
      if (!response.ok) throw new Error("HTTP " + response.status);
      const matches = await response.json();
      const match = matches.find(m =>
        (teamName(m).includes("bayern") && team2Name(m).includes("leipzig")) ||
        (teamName(m).includes("leipzig") && team2Name(m).includes("bayern"))
      );
      if (!match) throw new Error("Spiel nicht in der Datenquelle gefunden");
      const reverse = teamName(match).includes("leipzig");
      const home = getScore(match, reverse ? 2 : 1), away = getScore(match, reverse ? 1 : 2);
      $("homeScore").textContent = home == null ? "0" : home;
      $("awayScore").textContent = away == null ? "0" : away;
      $("gameStatus").textContent = statusText(match);
      $("liveLabel").textContent = match.matchIsFinished ? "ENDSTAND" : "LIVE-TICKER";
      const score = `${home ?? 0}:${away ?? 0}`;
      if (previousScore !== null && score !== previousScore) {
        const side = (home ?? 0) > parseInt(previousScore.split(":")[0],10) ? "BAYERN" : "LEIPZIG";
        flashGoal(`⚽ TOR FÜR ${side}! Na, das ging fix!  ${score.replace(":", " : ")}`);
      }
      previousScore = score;
      $("updated").textContent = "Aktualisiert " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    } catch (err) {
      $("gameStatus").textContent = "Warte auf Live-Daten · erneuter Versuch automatisch";
      $("updated").textContent = "Quelle: OpenLigaDB";
      console.warn(err);
    }
  }
  update();
  setInterval(update, 20000);
})();
</script>
</body>
</html>
